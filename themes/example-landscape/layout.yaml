# yaml-language-server: $schema=../../docs/layout.schema.json
# Example theme for a horizontally mounted 8.8" Universal Screen (1920×480).
# Run it with:  marquee run themes/example-landscape --preview
canvas:
  orientation: landscape
  fps: 30 # Smooth animation with a modest frame budget.

# The LED ring breathes in the theme's teal accent, turning warm when the CPU exceeds 80 C.
ring:
  color: "#36D1DC"
  effect: breathe
  brightness: 40
  source: cpu.temp
  when:
    - { above: 80, color: "#FF5A36" }

styles:
  label: { size: 26, weight: semibold, color: "#8B95AA", align: center }
  reading: { size: 84, weight: bold, color: "#F4F6FA", align: center }
  panel: { fill: "#FFFFFF08", radius: 28, stroke: { width: 2, color: "#FFFFFF18" } }
  ring: { fill: { linear: ["#36D1DC", "#FF5A36"] }, track: "#FFFFFF14", stroke: { cap: round } }
  bar: { radius: 18, track: "#FFFFFF14", fill: { linear: ["#36D1DC", "#5B86E5"] } }
  hot:
    color: "#FF5A36"
    glow: { color: "#FF5A36", radius: 18 }
    pulse: { property: glow, period: 1200, min: 0.3 }
  stale: { color: "#5A6275" }

background:
  - fill: { linear: ["#070A12", "#141B2E"], angle: 90 }
  - fill: { radial: ["#5B86E522", "#00000000"] }
    blend: screen

widgets:
  - type: group
    at: [30, 30]
    size: [420, 420]
    style: panel
    children:
      - { type: text, at: [0, 24], size: [420, 36], text: CPU, style: label }
      - { type: gauge, at: [60, 70], size: [300, 300], source: cpu.temp, min: 20, max: 100, thickness: 26, smooth: 400, style: ring }
      - type: value
        at: [60, 165]
        size: [300, 110]
        source: cpu.temp
        format: "{0:0}°"
        smooth: 400
        style: reading
        when:
          - { above: 85, style: hot }
          - { stale: true, style: stale }
      - type: text
        at: [0, 362]
        size: [420, 36]
        text: "{cpu.load:0}% · {cpu.clock / 1000:0.0} GHz"
        style: { extends: label, size: 24, weight: normal }

  - type: group
    at: [480, 30]
    size: [420, 420]
    style: panel
    children:
      - { type: text, at: [0, 24], size: [420, 36], text: GPU, style: label }
      - { type: gauge, at: [60, 70], size: [300, 300], source: gpu.temp, min: 20, max: 100, thickness: 26, smooth: 400, style: ring }
      - type: value
        at: [60, 165]
        size: [300, 110]
        source: gpu.temp
        format: "{0:0}°"
        smooth: 400
        style: reading
        when:
          - { above: 80, style: hot }
          - { stale: true, style: stale }
      - type: text
        at: [0, 362]
        size: [420, 36]
        text: "{gpu.load:0}% · {gpu.vram_used|bytes}"
        style: { extends: label, size: 24, weight: normal }

  - { type: text, at: [960, 40], size: [400, 36], text: GPU LOAD, style: { extends: label, align: left } }
  - type: graph
    at: [960, 90]
    size: [920, 180]
    source: gpu.load
    min: 0
    max: 100
    points: 120
    style: { stroke: { width: 3, color: "#36D1DC" }, fill: { linear: ["#36D1DC50", "#36D1DC00"], angle: 90 } }

  - { type: text, at: [960, 310], size: [120, 36], text: RAM, style: { extends: label, align: left } }
  - type: bar
    at: [1090, 310]
    size: [620, 36]
    source: ram.used_pct
    smooth: 400
    style: bar
    when:
      - { above: 90, style: { fill: "#FF5A36" } }
  - { type: value, at: [1720, 310], size: [160, 36], source: ram.used_pct, format: "{0:0}%", style: { size: 30, weight: semibold, align: right } }

  - { type: text, at: [960, 390], size: [120, 36], text: CPU, style: { extends: label, align: left } }
  - { type: bar, at: [1090, 390], size: [620, 36], source: cpu.load, smooth: 400, style: bar }
  - { type: value, at: [1720, 390], size: [160, 36], source: cpu.load, format: "{0:0}%", style: { size: 30, weight: semibold, align: right } }
