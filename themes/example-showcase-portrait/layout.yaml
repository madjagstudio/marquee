# yaml-language-server: $schema=../../docs/layout.schema.json
# The showcase for a vertically mounted 8.8" Universal Screen (480×1920): the same clock, dials, ring, chart and donut as
# example-showcase, stacked down the screen. That theme's comments explain each key; this one notes only what differs.
# Every key is in docs/themes-reference.md. Run it with:  marquee run themes/example-showcase-portrait --preview
canvas:
  orientation: portrait
  fps: 30 # Smooth animation with a modest frame budget.

# The LED ring breathes in the theme's teal accent, turning warm when the CPU exceeds 80 C.
ring:
  color: "#36D1DC"
  effect: breathe
  brightness: 40
  source: cpu.temp
  when:
    - { above: 80, color: "#FF5A36" }

styles:
  panel: { fill: "#FFFFFF08", radius: 28, stroke: { width: 2, color: "#FFFFFF14" } }
  heading: { size: 22, weight: semibold, color: "#8B95AA", letter_spacing: 4 }
  accent: { fill: { linear: ["#36D1DC", "#5B86E5"] }, radius: 2 }
  reading: { size: 56, weight: bold, color: "#F4F6FA", align: center }
  caption: { size: 22, color: "#8B95AA", align: center }
  meter: { fill: { linear: ["#36D1DC", "#5B86E5"] }, track: "#FFFFFF10", radius: 3 }
  hot:
    color: "#FF5A36"
    glow: { color: "#FF5A36", radius: 18 }
    pulse: { property: glow, period: 1200, min: 0.3 }
  stale: { color: "#5A6275" }
  gone: { opacity: 0 }
  glow: { fill: { radial: ["#36D1DC30", "#36D1DC00"] }, blend: screen }

background:
  - name: Night
    fill: { linear: ["#070A12", "#141B2E"], angle: 90 }
  - name: Blue haze
    fill: { radial: ["#5B86E522", "#00000000"] }
    blend: screen
    locked: true
  - name: Warm tint
    fill: "#FF5A3618"
    blend: overlay
    hidden: true

widgets:
  # Five panels, each the screen's width less a 24 px margin, 16 px apart.
  # The title, the time and the radar clip beside them.
  - type: group
    name: Clock
    at: [24, 24]
    size: [432, 240]
    style: panel
    children:
      - type: text
        name: Title
        at: [28, 18]
        size: [244, 54]
        text: MARQUEE
        style:
          size: 40
          weight: bold
          letter_spacing: 3
          text_fill: { linear: ["#F4F6FA", "#36D1DC", "#5B86E5"], stops: [0, 0.3, 1] }
          text_stroke: { width: 2, color: "#A770EF" }
      - type: text
        name: Weekday
        at: [28, 86]
        size: [200, 30]
        text: "{now|time:ddd}"
        style: { extends: heading, color: "#36D1DC", case: upper }
      - type: text
        name: Time
        at: [24, 112]
        size: [252, 96]
        text: "{now|time:HH:mm}"
        style: { size: 80, weight: bold, color: "#F4F6FA" }
      # cover crops the clip's sides to fill this taller box.
      - type: video
        name: Radar
        at: [280, 40]
        size: [128, 160]
        src: video/radar.mp4
        fit: cover
        style: { radius: 18, stroke: { width: 2, color: "#FFFFFF14" } }

  # CPU: the needle dial, centred in the wider panel.
  - type: group
    name: CPU
    at: [24, 280]
    size: [432, 420]
    style: panel
    children:
      - { type: shape, shape: ellipse, at: [56, 40], size: [320, 320], style: glow }
      - { type: text, at: [28, 20], size: [200, 34], text: CPU, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      - type: shape
        name: CPU status light
        shape: ellipse
        at: [386, 29]
        size: [16, 16]
        source: cpu.temp
        style: { fill: "#36D1DC" }
        when:
          - { above: 85, style: { fill: "#FF5A36", glow: { color: "#FF5A36", radius: 10 } } }
          - { stale: true, style: { fill: "#5A6275" } }
      - type: gauge
        name: CPU dial
        at: [76, 66]
        size: [280, 280]
        source: cpu.temp
        min: 20
        max: 100
        thickness: 12
        smooth: 400
        ticks: { major: 8, minor: 1, length: 11, width: 2, color: "#FFFFFF60", labels: "{0:0}" }
        needle: { width: 8, length: 0.68, color: "#F4F6FA", cap: 12 }
        style:
          size: 16
          weight: medium
          color: "#8B95AA"
          fill: { linear: ["#36D1DC", "#FF5A36"] }
          track: "#FFFFFF14"
          shadow: { color: "#00000080", x: 2, y: 3, blur: 4 }
        when:
          - { above: 85, style: { fill: "#FF5A36" } }
      - type: value
        name: CPU temperature
        at: [116, 296]
        size: [200, 64]
        source: cpu.temp
        smooth: 400
        style: { extends: reading, size: 50 }
        spans:
          - { text: "{0:0}" }
          - { text: "°C", style: { size: 24, weight: semibold, color: "#36D1DC" } }
        when:
          - { above: 85, style: hot }
          - { stale: true, style: stale }
      - type: text
        at: [0, 372]
        size: [432, 30]
        text: "{cpu.load:0}% · {cpu.clock / 1000:0.0} GHz"
        style: caption
        when:
          - { stale: true, style: gone }

  # GPU: the segmented ring.
  - type: group
    name: GPU
    at: [24, 716]
    size: [432, 400]
    style: panel
    children:
      - { type: shape, shape: ellipse, at: [76, 60], size: [280, 280], style: { extends: glow, fill: { radial: ["#5B86E538", "#5B86E500"] } } }
      - { type: text, at: [28, 20], size: [200, 34], text: GPU, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      - { type: shape, shape: arc, at: [84, 68], size: [264, 264], start: 135, sweep: 270, thickness: 2, style: { fill: "#FFFFFF24" } }
      - type: gauge
        name: GPU ring
        at: [100, 84]
        size: [232, 232]
        source: gpu.temp
        min: 20
        max: 100
        thickness: 20
        segments: 24
        gap: 3
        smooth: 400
        style: { extends: meter, fill: { linear: ["#36D1DC", "#5B86E5", "#FF5A36"] }, radius: 2 }
      - type: value
        at: [116, 165]
        size: [200, 70]
        source: gpu.temp
        format: "{0:0}°"
        smooth: 400
        style: { extends: reading, size: 56 }
        when:
          - { above: 80, style: hot }
          - { stale: true, style: stale }
      - { type: text, at: [116, 230], size: [200, 24], text: TEMP, style: { extends: heading, size: 16, align: center } }
      - type: text
        at: [0, 352]
        size: [432, 30]
        text: "{gpu.load:0}% · {gpu.vram_used|bytes}"
        style: caption
        when:
          - { stale: true, style: gone }

  # Load: the two-series chart, then the same loads now as segmented bars.
  - type: group
    name: Load
    at: [24, 1132]
    size: [432, 410]
    style: panel
    children:
      - { type: text, at: [28, 20], size: [230, 34], text: LOAD HISTORY, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      - { type: shape, shape: ellipse, at: [262, 31], size: [12, 12], style: { fill: "#36D1DC" } }
      - { type: text, at: [282, 22], size: [50, 30], text: CPU, style: { size: 18, weight: semibold, color: "#C8D0E0" } }
      - { type: shape, shape: ellipse, at: [338, 31], size: [12, 12], style: { fill: "#5B86E5" } }
      - { type: text, at: [358, 22], size: [52, 30], text: GPU, style: { size: 18, weight: semibold, color: "#C8D0E0" } }
      - type: graph
        name: Load chart
        at: [28, 72]
        size: [376, 200]
        kind: area
        min: 0
        max: 100
        points: 120
        grid: { lines: 3, color: "#FFFFFF14" }
        style: { stroke: { width: 2.5 } }
        series:
          - { source: gpu.load, style: { stroke: { color: "#5B86E5" }, fill: { linear: ["#5B86E560", "#5B86E500"], angle: 90 } } }
          - { source: cpu.load, style: { stroke: { color: "#36D1DC" }, fill: { linear: ["#36D1DC60", "#36D1DC00"], angle: 90 } } }
      - { type: shape, shape: line, at: [28, 292], size: [376, 0], style: { stroke: { width: 2, color: "#FFFFFF12" } } }
      - { type: text, at: [28, 312], size: [70, 36], text: CPU, style: { extends: heading, size: 18, letter_spacing: 2 } }
      - { type: bar, at: [100, 316], size: [210, 28], source: cpu.load, segments: 16, gap: 4, smooth: 400, style: meter }
      - { type: value, at: [316, 312], size: [88, 36], source: cpu.load, format: "{0:0}%", style: { size: 26, weight: semibold, align: right } }
      - { type: text, at: [28, 362], size: [70, 36], text: GPU, style: { extends: heading, size: 18, letter_spacing: 2 } }
      - { type: bar, at: [100, 366], size: [210, 28], source: gpu.load, segments: 16, gap: 4, smooth: 400, style: meter }
      - { type: value, at: [316, 362], size: [88, 36], source: gpu.load, format: "{0:0}%", style: { size: 26, weight: semibold, align: right } }

  # Memory: the donut on the left, the bytes in use and the game's frame rate beside it.
  - type: group
    name: Memory
    at: [24, 1558]
    size: [432, 338]
    style: panel
    children:
      - { type: text, at: [28, 20], size: [200, 34], text: MEMORY, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      - type: donut
        name: Memory donut
        at: [28, 72]
        size: [190, 190]
        hole: 0.74
        gap: 3
        style: { track: "#FFFFFF0C" }
        slices:
          - { source: ram.used_pct, style: { fill: { linear: ["#36D1DC", "#5B86E5"] }, glow: { color: "#36D1DC70", radius: 12 } } }
          - { source: 100 - ram.used_pct, style: { fill: "#FFFFFF1C" } }
      - type: value
        at: [53, 134]
        size: [140, 52]
        source: ram.used_pct
        format: "{0:0}%"
        smooth: 400
        style: { extends: reading, size: 42 }
        when:
          - { above: 90, style: hot }
          - { stale: true, style: stale }
      - { type: text, at: [53, 186], size: [140, 22], text: USED, style: { extends: heading, size: 16, align: center } }
      - type: text
        at: [240, 88]
        size: [164, 28]
        text: "{ram.used|bytes} in use"
        style: { extends: caption, size: 20, align: left }
        when:
          - { stale: true, style: gone }
      - { type: shape, shape: line, at: [240, 132], size: [164, 0], style: { stroke: { width: 2, color: "#FFFFFF12" } } }
      - type: text
        at: [240, 146]
        size: [164, 40]
        text: "{fps:0} FPS"
        style: { size: 30, weight: bold, color: "#F4F6FA" }
        when:
          - { stale: true, style: stale }
      - type: text
        at: [240, 190]
        size: [164, 28]
        text: "1% low {fps.1pct_low:0}"
        style: { size: 18, color: "#8B95AA" }
        when:
          - { stale: true, style: stale }
      - type: text
        at: [28, 280]
        size: [376, 44]
        text: FPS shows while a game runs. All of this is one layout.yaml.
        style: { size: 16, color: "#7A8499", line_height: 1.3, wrap: true }
