# yaml-language-server: $schema=../../docs/layout.schema.json
# A tour of the theme format for a horizontally mounted 8.8" Universal Screen (1920×480): shapes, dials, segmented
# meters, charts, a donut, wrapped text, rotation, blending and hidden widgets, each where it fits.
# Every key is in docs/themes-reference.md. Run it with:  marquee run themes/example-showcase --preview
canvas:
  orientation: landscape
  fps: 30

styles:
  panel: { fill: "#FFFFFF08", radius: 28, stroke: { width: 2, color: "#FFFFFF14" } }
  # letter_spacing adds px between characters: wide-set capitals read as headings.
  heading: { size: 22, weight: semibold, color: "#8B95AA", letter_spacing: 4 }
  accent: { fill: { linear: ["#36D1DC", "#5B86E5"] }, radius: 2 }
  reading: { size: 56, weight: bold, color: "#F4F6FA", align: center }
  caption: { size: 22, color: "#8B95AA", align: center }
  meter: { fill: { linear: ["#36D1DC", "#5B86E5"] }, track: "#FFFFFF10", radius: 3 }
  hot:
    color: "#FF5A36"
    glow: { color: "#FF5A36", radius: 18 }
    pulse: { property: glow, period: 1200, min: 0.3 }
  stale: { color: "#5A6275" }
  # A caption made only of values would read "—% · —" while they're missing, so it steps aside instead.
  gone: { opacity: 0 }
  # blend: screen only ever lightens, so a soft radial glow lifts the panel under it without hiding anything.
  glow: { fill: { radial: ["#36D1DC30", "#36D1DC00"] }, blend: screen }

background:
  - fill: { linear: ["#070A12", "#141B2E"], angle: 90 }
  - fill: { radial: ["#5B86E522", "#00000000"] }
    blend: screen
    # locked only stops the theme editor changing this layer; the screen ignores it.
    locked: true
  # hidden: true leaves a layer (or widget) off the screen, and marquee validate still checks it. Set it to false
  # for a warmer tint.
  - fill: "#FF5A3618"
    blend: overlay
    hidden: true

widgets:
  # CPU: a needle dial with ticks and labels, its arc shading from cool to hot.
  - type: group
    at: [24, 24]
    size: [420, 432]
    style: panel
    children:
      - { type: shape, shape: ellipse, at: [30, 36], size: [360, 360], style: glow }
      - { type: text, at: [28, 20], size: [200, 34], text: CPU, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      # A status light: a shape with a source can be restyled by when rules, like any widget.
      - type: shape
        shape: ellipse
        at: [374, 29]
        size: [16, 16]
        source: cpu.temp
        style: { fill: "#36D1DC" }
        when:
          - { above: 85, style: { fill: "#FF5A36", glow: { color: "#FF5A36", radius: 10 } } }
          - { stale: true, style: { fill: "#5A6275" } }
      - type: gauge
        at: [60, 66]
        size: [300, 300]
        source: cpu.temp
        min: 20
        max: 100
        thickness: 12
        smooth: 400
        # 8 divisions of 20 to 100 put a labelled tick every 10°C, with one minor tick between each.
        ticks: { major: 8, minor: 1, length: 12, width: 2, color: "#FFFFFF60", labels: "{0:0}" }
        needle: { width: 8, length: 0.68, color: "#F4F6FA", cap: 12 }
        style:
          size: 17
          weight: medium
          color: "#8B95AA"
          fill: { linear: ["#36D1DC", "#FF5A36"] }
          track: "#FFFFFF14"
          shadow: { color: "#00000080", x: 2, y: 3, blur: 4 }
        when:
          - { above: 85, style: { fill: "#FF5A36" } }
      - type: value
        at: [110, 262]
        size: [200, 64]
        source: cpu.temp
        format: "{0:0}°"
        smooth: 400
        style: { extends: reading, size: 50 }
        when:
          - { above: 85, style: hot }
          - { stale: true, style: stale }
      - type: text
        at: [0, 380]
        size: [420, 30]
        text: "{cpu.load:0}% · {cpu.clock / 1000:0.0} GHz"
        style: caption
        when:
          - { stale: true, style: gone }

  # GPU: a segmented ring, VU-meter style. One gradient spans the whole meter, so each segment keeps its own shade.
  - type: group
    at: [462, 24]
    size: [350, 432]
    style: panel
    children:
      - { type: shape, shape: ellipse, at: [15, 46], size: [320, 320], style: { extends: glow, fill: { radial: ["#5B86E538", "#5B86E500"] } } }
      - { type: text, at: [28, 20], size: [200, 34], text: GPU, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      # An arc shape: a thin band round the ring, a gauge's arc with no value.
      - { type: shape, shape: arc, at: [25, 56], size: [300, 300], start: 135, sweep: 270, thickness: 2, style: { fill: "#FFFFFF24" } }
      - type: gauge
        at: [43, 74]
        size: [264, 264]
        source: gpu.temp
        min: 20
        max: 100
        thickness: 22
        segments: 27
        gap: 3
        smooth: 400
        style: { extends: meter, fill: { linear: ["#36D1DC", "#5B86E5", "#FF5A36"] }, radius: 2 }
      - type: value
        at: [75, 168]
        size: [200, 70]
        source: gpu.temp
        format: "{0:0}°"
        smooth: 400
        style: { extends: reading, size: 60 }
        when:
          - { above: 80, style: hot }
          - { stale: true, style: stale }
      - { type: text, at: [75, 236], size: [200, 24], text: TEMP, style: { extends: heading, size: 17, align: center } }
      - type: text
        at: [0, 380]
        size: [350, 30]
        text: "{gpu.load:0}% · {gpu.vram_used|bytes}"
        style: caption
        when:
          - { stale: true, style: gone }

  # Load: an area chart with two series and gridlines, then the same two loads now, as segmented bars.
  - type: group
    at: [830, 24]
    size: [660, 432]
    style: panel
    children:
      - { type: text, at: [28, 20], size: [300, 34], text: LOAD HISTORY, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      - { type: shape, shape: ellipse, at: [474, 31], size: [12, 12], style: { fill: "#36D1DC" } }
      - { type: text, at: [494, 22], size: [60, 30], text: CPU, style: { size: 18, weight: semibold, color: "#C8D0E0" } }
      - { type: shape, shape: ellipse, at: [560, 31], size: [12, 12], style: { fill: "#5B86E5" } }
      - { type: text, at: [580, 22], size: [60, 30], text: GPU, style: { size: 18, weight: semibold, color: "#C8D0E0" } }
      - type: graph
        at: [28, 72]
        size: [604, 210]
        kind: area
        min: 0
        max: 100
        points: 120
        # 3 lines split 0 to 100 into quarters.
        grid: { lines: 3, color: "#FFFFFF14" }
        style: { stroke: { width: 2.5 } }
        # Drawn in order, so CPU sits in front of GPU. Each series' style goes over the graph's.
        series:
          - { source: gpu.load, style: { stroke: { color: "#5B86E5" }, fill: { linear: ["#5B86E560", "#5B86E500"], angle: 90 } } }
          - { source: cpu.load, style: { stroke: { color: "#36D1DC" }, fill: { linear: ["#36D1DC60", "#36D1DC00"], angle: 90 } } }
      # The chart's box, for lining things up while editing. Hidden, so the screen never shows it.
      - { type: shape, shape: rect, at: [28, 72], size: [604, 210], hidden: true, style: { stroke: { width: 1, color: "#FF00FF" } } }
      - { type: shape, shape: line, at: [28, 302], size: [604, 0], style: { stroke: { width: 2, color: "#FFFFFF12" } } }
      - { type: text, at: [28, 322], size: [70, 36], text: CPU, style: { extends: heading, size: 18, letter_spacing: 2 } }
      - { type: bar, at: [100, 326], size: [430, 28], source: cpu.load, segments: 30, gap: 4, smooth: 400, style: meter }
      - { type: value, at: [540, 322], size: [92, 36], source: cpu.load, format: "{0:0}%", style: { size: 26, weight: semibold, align: right } }
      - { type: text, at: [28, 372], size: [70, 36], text: GPU, style: { extends: heading, size: 18, letter_spacing: 2 } }
      - { type: bar, at: [100, 376], size: [430, 28], source: gpu.load, segments: 30, gap: 4, smooth: 400, style: meter }
      - { type: value, at: [540, 372], size: [92, 36], source: gpu.load, format: "{0:0}%", style: { size: 26, weight: semibold, align: right } }

  # Memory: a donut splitting RAM into used and free, then the game's frame rate.
  - type: group
    at: [1508, 24]
    size: [330, 432]
    style: panel
    children:
      - { type: text, at: [28, 20], size: [200, 34], text: MEMORY, style: heading }
      - { type: shape, shape: rect, at: [30, 56], size: [36, 4], style: accent }
      - type: donut
        at: [70, 66]
        size: [190, 190]
        hole: 0.74
        gap: 3
        style: { track: "#FFFFFF0C" }
        # A slice's source can be an expression: what isn't used is free.
        slices:
          - { source: ram.used_pct, label: used, style: { fill: { linear: ["#36D1DC", "#5B86E5"] }, glow: { color: "#36D1DC70", radius: 12 } } }
          - { source: 100 - ram.used_pct, label: free, style: { fill: "#FFFFFF1C" } }
      - type: value
        at: [95, 128]
        size: [140, 52]
        source: ram.used_pct
        format: "{0:0}%"
        smooth: 400
        style: { extends: reading, size: 42 }
        when:
          - { above: 90, style: hot }
          - { stale: true, style: stale }
      - { type: text, at: [95, 180], size: [140, 22], text: USED, style: { extends: heading, size: 16, align: center } }
      - type: text
        at: [0, 266]
        size: [330, 30]
        text: "{ram.used|bytes} in use"
        style: { extends: caption, size: 20 }
        when:
          - { stale: true, style: gone }
      - { type: shape, shape: line, at: [28, 306], size: [274, 0], style: { stroke: { width: 2, color: "#FFFFFF12" } } }
      # fps goes stale with no game in front: the text shows — and the stale rule dims it.
      - type: text
        at: [28, 316]
        size: [170, 40]
        text: "{fps:0} FPS"
        style: { size: 30, weight: bold, color: "#F4F6FA" }
        when:
          - { stale: true, style: stale }
      - type: text
        at: [198, 320]
        size: [104, 34]
        text: "1% {fps.1pct_low:0}"
        style: { size: 18, color: "#8B95AA", align: right }
        when:
          - { stale: true, style: stale }
      # wrap: true breaks text at spaces to fit its box; line_height spaces the lines, as a multiple of the size.
      - type: text
        at: [28, 362]
        size: [274, 62]
        text: FPS shows while a game is in front. All of this is one layout.yaml.
        style: { size: 16, color: "#7A8499", line_height: 1.3, wrap: true }

  # rotate turns a widget about its own centre: this 432×40 strip stands upright along the right edge.
  - type: text
    at: [1660, 220]
    size: [432, 40]
    rotate: 90
    text: MARQUEE  ·  FORMAT V2
    style: { size: 16, weight: semibold, color: "#FFFFFF38", align: center, letter_spacing: 8 }
