name: ci
on:
  # main after a merge, and PRs; a branch push without a PR runs nothing.
  push:
    branches: [main]
  pull_request:
    # ready_for_review runs the first full verification after a draft's QA.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new PR revision cancels the PR's previous run; main and manual runs never share a group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # Drafts are QA'd locally; hosted CI runs once the PR is marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Media Foundation (off by default on Windows Server)
        # The video tests decode real MP4s. Without Media Foundation they only check the "install the Media Feature
        # Pack" error, so make its absence fail the run instead of passing quietly.
        shell: pwsh
        run: |
          if ((Get-WindowsFeature Server-Media-Foundation).InstallState -ne 'Installed') { Install-WindowsFeature Server-Media-Foundation }
          if (-not (Test-Path "$env:WINDIR\System32\mfreadwrite.dll")) { throw 'Media Foundation is missing; the video tests would only check the error path' }
      - run: dotnet test --configuration Release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: received-snapshots
          path: tests/**/Snapshots/*.received.png
          if-no-files-found: ignore
